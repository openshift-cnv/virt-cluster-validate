name: omc Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  omc-tests:
    name: omc Integration
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omc
        run: |
          curl -sL "https://github.com/gmeghnag/omc/releases/latest/download/omc_Linux_x86_64.tar.gz" \
            | tar xzf - -C /usr/local/bin omc
          omc version

      - name: Run omc integration tests
        run: python3 -m unittest discover -s tests -p 'test_omc*' -v
