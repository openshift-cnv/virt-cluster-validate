name: Build and publish images

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - v*

permissions:
  contents: read

jobs:
  build-and-push:
    # Do not publish images from contributor forks, even when this workflow is
    # manually enabled there.  Repository secrets are intentionally available
    # only to the protected upstream repository.
    if: github.repository == 'openshift-cnv/virt-cluster-validate'
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: validator
            image: quay.io/openshift-cnv/virt-cluster-validate
            file: Containerfile
          - name: controller
            image: quay.io/openshift-cnv/virt-validation-controller
            file: build/validation-controller/Containerfile
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=dev,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summarize published image
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo
            echo "\`${{ matrix.image }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Use this digest in deployment manifests. The \`dev\` tag is a convenience tag for main only."
          } >> "$GITHUB_STEP_SUMMARY"
